services:
  db:
    image: postgres:16
    container_name: cogip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cogip
      POSTGRES_PASSWORD: change-me-please
      POSTGRES_DB: pointeuse
    ports:
      - "5432:5432"
    volumes:
      - cogip-data:/var/lib/postgresql/data

volumes:
  cogip-data: